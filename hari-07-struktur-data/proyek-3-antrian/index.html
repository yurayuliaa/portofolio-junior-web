<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klinik Sehat - Antrean dan Catatan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Klinik Sehat</h1>
      <p>Simulator antrean dan riwayat catatan</p>
    </header>

    <main>
      <section aria-labelledby="judul-antrean">
        <h2 id="judul-antrean">Antrean loket</h2>
        <p class="keterangan">Sedang dipanggil</p>
        <p id="dipanggil" class="nomor-besar" aria-live="polite">-</p>
        <p>Menunggu: <strong id="jumlah">0</strong> pasien</p>
        <div class="aksi">
          <button id="ambil" type="button">Ambil Nomor</button>
          <button id="panggil" type="button">Panggil Berikutnya</button>
          <button id="reset" type="button" class="bahaya">Reset</button>
        </div>
        <p id="pesan-antrean" class="pesan" role="status"></p>
        <h3>Daftar menunggu</h3>
        <ol id="daftar"></ol>
        <h3>5 nomor terakhir dipanggil</h3>
        <p id="riwayat-panggil">Belum ada pemanggilan.</p>
      </section>

      <section aria-labelledby="judul-editor">
        <h2 id="judul-editor">Editor catatan</h2>
        <label for="editor">Catatan pasien</label>
        <textarea id="editor" rows="9"></textarea>
        <div class="aksi">
          <button id="undo" type="button" disabled>Undo</button>
          <button id="redo" type="button" disabled>Redo</button>
          <span id="info-riwayat"></span>
        </div>
        <p id="pesan-editor" class="pesan" role="status"></p>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
