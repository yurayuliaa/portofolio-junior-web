<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Pendaftaran 🎀</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="header-coquette">🎀 Daftar Akun 🎀</div>
    <form id="form-daftar" novalidate>
      <p>
        <label for="nama">Nama</label>
        <input id="nama" name="nama" type="text" autocomplete="name" aria-describedby="galat-nama" aria-invalid="false">
        <span id="galat-nama" class="galat" aria-live="polite"></span>
      </p>
      <p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="galat-email" aria-invalid="false">
        <span id="galat-email" class="galat" aria-live="polite"></span>
      </p>
      <p>
        <label for="hp">Nomor HP</label>
        <input id="hp" name="hp" type="tel" autocomplete="tel" aria-describedby="galat-hp" aria-invalid="false">
        <span id="galat-hp" class="galat" aria-live="polite"></span>
      </p>
      <p>
        <label for="sandi">Kata sandi</label>
        <input id="sandi" name="sandi" type="password" autocomplete="new-password" aria-describedby="galat-sandi" aria-invalid="false">
        <span id="galat-sandi" class="galat" aria-live="polite"></span>
      </p>
      <p>
        <label for="konfirmasi">Konfirmasi sandi</label>
        <input id="konfirmasi" name="konfirmasi" type="password" autocomplete="new-password" aria-describedby="galat-konfirmasi" aria-invalid="false">
        <span id="galat-konfirmasi" class="galat" aria-live="polite"></span>
      </p>
      <button id="kirim" type="submit" disabled>Kirim</button>
    </form>
    <section id="ringkasan" hidden></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
